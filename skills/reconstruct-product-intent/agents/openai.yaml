interface:
  display_name: "Reconstruct Product Intent"
  short_description: "Reconstruct lifecycle journeys and a confirmed build specification"
  default_prompt: "Convert this existing software project into an authority-confirmed Product Intent Package in format 3.0.0. Treat source artifacts as evidence, reconstruct Lifecycle Journey Maps after actor and capability scope and before detailed flows, keep observed, inferred, proposed, and confirmed intent separate, never infer emotion from diagrams, and do not claim build-ready until every journey and handoff gate passes."
policy:
  allow_implicit_invocation: true
