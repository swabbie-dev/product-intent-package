openapi: 3.1.0
info:
  title: Counter API
  version: 1.0.0
paths:
  /counter/increment:
    post:
      operationId: API-001
      responses:
        '200':
          description: New counter value
          content:
            application/json:
              schema:
                type: object
                required:
                  - value
                properties:
                  value:
                    type: integer
                    minimum: 0
        '503':
          description: No mutation; retry allowed
components: {}
