default_policy: forbidden_if_behavior_affecting_or_user_observable
grants:
  - id: DIS-001
    scope: Internal HTTP client library used inside ARCH-002
    allowed_choices:
      - Actively maintained library compatible with the selected runtime
    forbidden_outcomes:
      - Different API-001 behavior
      - Different retry or timeout semantics
      - Additional external data transfer
    constraints:
      - Must satisfy QC-001 and the API-001 contract
    authority_id: AUTH-OWNER
    confirmation_decision_id: DEC-004
