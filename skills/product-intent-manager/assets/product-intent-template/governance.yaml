authorities:
  - id: AUTH-001
    name: ''
    role: accountable_product_authority

default_authority_id: AUTH-001

decisions: []
# - id: DEC-001
#   status: confirmed
#   statement: ''
#   authority_id: AUTH-001
#   decision_ref: ''
#   affects: []
# `decision_ref` identifies the direct authority statement or approval source;
# same-task PIP, ticket, test, audit, and implementation edits cannot confirm one another.
# A `dcl.target.decision_id` may point to a specific decision here. Do not add
# one merely to restate the reviewed package confirmation. DCL current
# assessments remain inferred.

implementation_observations: []
# Keep this sparse and material; it is not a change log or product authority.
# - status: observed
#   summary: ''
#   source_ref: git:<full-revision>
#   affected_ids: []
#   relationship_to_confirmed_intent: aligns
# Use aligns, deviates, or unclear. Add an ID only when referenced elsewhere.

open_items: []
