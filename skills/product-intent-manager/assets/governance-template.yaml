# Copy this file to `governance.yaml` only when several product leaders or
# delegated authorities need explicit scope, precedence, or supersession to
# coordinate overlapping decisions. Do not use it for readiness, signoff,
# proposals, implementation findings, or routine history.

authorities: []
# List only product authorities whose overlapping or delegated scopes must be
# distinguished for the team.
# - id: AUTH-001
#   name: ''
#   role: product_leader
#   scope: []
#   precedence: ''

decisions: []
# Keep only cross-authority decisions whose ownership, precedence, or
# supersession must remain visible to the team. The owning PIP artifact still
# holds the current requirement and current rationale; do not repeat them here.
# - id: DEC-001
#   authority_id: AUTH-001
#   affects: []
#   supersedes: []
#   coordination_context: ''
