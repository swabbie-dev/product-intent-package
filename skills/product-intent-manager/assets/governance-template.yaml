# Copy this file to `governance.yaml` only when a larger team has several
# product leaders making decisions that require active coordination beyond what
# product.yaml, the owning artifacts, Git, and the task system communicate.
# Do not use it as a routine history.

authorities: []
# List only product authorities whose overlapping or delegated scopes must be
# distinguished for the team.
# - id: AUTH-001
#   name: ''
#   role: product_leader
#   scope: []

decisions: []
# Keep only decisions whose authority, rationale, precedence, or supersession
# must remain visible to several product leaders. Do not repeat PIP content.
# - id: DEC-001
#   status: confirmed
#   statement: ''
#   authority_id: AUTH-001
#   decision_ref: ''
#   affects: []

open_items: []
# Use only for active cross-authority questions, conflicts, or proposed changes.
# - id: OPEN-001
#   type: conflict # or question or proposed_change
#   status: blocked # proposed_change normally uses proposed
#   summary: ''
#   why_it_matters: ''
#   affected_ids: []
#   authority_id: AUTH-001

implementation_observations: []
# Use only for sparse, material cross-artifact evidence needed by the larger
# team. Local observations belong beside their owning target; routine history
# stays in Git or the task system.
# - status: observed
#   summary: ''
#   source_ref: git:<full-revision>
#   affected_ids: []
#   relationship_to_confirmed_intent: aligns # or deviates or unclear
