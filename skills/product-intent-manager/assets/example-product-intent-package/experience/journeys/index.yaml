journeys:
  - id: JOURNEY-001
    title: Increment and observe the counter
    journey_type: job_task
    type_rationale: The product helps one actor complete a small repeatable counter task.
    structural_variant: single_actor
    actor_ids:
      - ACTOR-001
    scope:
      in_scope:
        - Open the Counter screen.
        - Increment the persisted counter once.
        - Observe the new value.
        - Repeat or leave the task.
      out_of_scope:
        - Authentication and multi-tenancy.
    target_view: intended_current
    intent_status: confirmed
    status: confirmed
    initiating_trigger: The actor opens the Counter screen to change and check the value.
    desired_outcome: The actor sees the persisted counter value increase by one for each accepted increment.
    success_conditions:
      - The accepted request changes the persisted value by exactly one.
      - The updated value is displayed to the actor.
    terminal_conditions:
      - The actor sees the updated value and leaves the Counter screen.
      - The actor retries after a failure or stops without a mutation.
    time_axis: task
    topology:
      - cyclical
      - branching
    recurrence_model: The actor may repeat the increment and observe cycle until the task is complete.
    authority_id: AUTH-OWNER
    confirmation_decision_id: DEC-006
    source_refs:
      - EVID-001
      - EVID-002
    version: 2
