        name: Increment
        product_scope: inside
        actor_goal: Request one counter increment.
        entry_conditions:
          - The current counter value is visible.
          - The increment control is available.
        exit_conditions:
          - The product accepts the request and starts the response.
          - The product rejects the request and offers recovery.
        touchpoint_ids:
          - SCREEN-001
          - COMP-001
          - API-001
        actions:
          - id: JOURNEY-001.action-02
            actor_action: Press the increment control once.
            product_response: The product sends one increment request, waits for
              the result, and does not resend when the result is unknown.
            response_artifact_ids:
              - FLOW-001
              - RULE-001
              - SM-001
              - DT-001
              - API-001
              - SEQ-001
              - ACC-005
        state_data_event_ids:
          - SM-001
          - DATA-001
          - API-001
        exceptions_recovery:
          failure: Do not mutate the value when the request fails.
          pause_resume: Keep the submitting state until the request resolves or
            times out.
          recovery: Retry only after a confirmed pre-commit failure. If the
            outcome is unknown, load the current value before another increment.
        intent_items:
