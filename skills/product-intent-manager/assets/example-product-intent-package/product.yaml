schema_version: 6.1.0
package_id: PIP-COUNTER
status: build_ready
confirmation_decision_id: DEC-008
confirmation_revision: ff16e1b34df1947306aa5c800c269218d5b4f77d
name: Counter
target:
  baseline: greenfield
  release: 1.0.0
outcome: A user can read and increment one persisted counter without creating an uncertain duplicate increment.
actors:
  - id: ACTOR-001
    name: User
    goal: See the current counter value and increase it by one.
capabilities:
  - id: CAP-001
    name: Read and increment counter
    actor_ids:
      - ACTOR-001
    outcome: The persisted value is visible and one-at-a-time increment requests are handled safely.
    related_ids:
      - FLOW-001
      - DOM-001
      - DATA-001
      - SEQ-001
      - SEQ-002
release:
  included_capability_ids:
    - CAP-001
  boundary: One user-facing counter backed by an application service and persistent storage.
  exclusions:
    - Authentication, accounts, and multi-tenancy
  success_measures:
    - Every accepted increment changes the persisted value exactly once.
    - The user sees the persisted value after loading, incrementing, or reconciling an unknown outcome.
