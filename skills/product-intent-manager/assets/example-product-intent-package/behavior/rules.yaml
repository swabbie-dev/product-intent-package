rules:
  - id: RULE-001
    scope_ids:
      - CAP-001
    priority: 100
    when:
      - one valid increment request is accepted
    then:
      - increase persisted counter value by exactly one
      - return the new value
    exceptions:
      - requests that fail before commit do not change the value
      - if the response outcome is unknown, do not resend the increment; load the
        current value before the product accepts another increment
    examples:
      - before: 4
        result: 5
