rules:
  - id: RULE-001
    name: Persist and present the counter safely
    applies_to:
      - CAP-001
    when:
      - the counter is loaded
      - an increment is attempted
    then:
      - loading returns the current persisted value without mutation
      - each accepted increment increases the persisted value by exactly one and returns the new value
      - a confirmed failure before commit leaves the value unchanged and offers Retry
      - an unknown increment outcome blocks another increment until the current persisted value is read successfully
