cases:
  - id: proportional-greenfield
    prompt: Create a Product Intent Package for a small single-user application.
    should_activate: true
    must:
      - start with the four default format-6.3 files
      - omit governance, authority registries, decision history, signatures, and confirmation metadata for this small product
      - add an optional artifact only when it answers a distinct question
      - record outcome, actors, capabilities, release scope, blockers, and acceptance
      - use direct stable-ID links rather than an artifact index or traceability graph
      - omit a journey when a focused user flow already explains the experience
      - leave non-observable implementation choices to engineering within confirmed constraints

  - id: reconstruct-existing-product
    prompt: Reconstruct the current intent of this existing product from its screens,
      code, documents, and stakeholder decisions.
    should_activate: true
    must:
      - declare one target baseline
      - treat sources as evidence rather than automatic target intent
      - separate observed, inferred, proposed, confirmed, blocked, and stale material
      - route material conflicts through the product leader
      - preserve a legacy package format unless migration is explicitly requested
      - create only artifacts supported by product complexity

  - id: iterate-semantic-change
    prompt: Change subscriptions so users can pause and resume, then update the Product
      Intent Package.
    should_activate: true
    must:
      - identify the changed actor outcome and consequential decision
      - update actual dependent artifacts and acceptance outcomes
      - leave unresolved affected material visibly blocked or stale
      - use Git for ordinary history rather than creating bookkeeping for every edit
      - avoid changing unrelated artifacts

  - id: separate-diagram-responsibilities
    prompt: A user flow repeats membership checks, database reads, sorting, pagination,
      and failures from its sequence diagram. Simplify the diagrams without losing context.
    should_activate: true
    must:
      - keep actor actions, surfaces, visible outcomes, and recovery in the user flow
      - make consequential surface boundaries clear enough to identify needed mockups and state variants
      - keep ordered runtime messages and failures in focused sequences
      - keep valid lifecycle states and transitions in state machines
      - keep entities and relationships in the data model or ERD
      - use stack context for physical participants, responsibilities, and owned state
      - use one rule or decision table for condition combinations
      - preserve context with direct stable-ID references instead of copied logic

  - id: pip-governed-implementation
    prompt: Implement the application described by this completed Product Intent Package.
    should_activate: true
    must:
      - preserve the task-start canonical PIP revision as the target baseline
      - prevent same-task tickets, code, tests, audits, and working PIP edits from circularly establishing new product intent
      - pause for authority before a new classification, population split, processing-boundary change, broad backfill, or product-policy predicate
      - keep ordinary engineering choices within confirmed outcomes and constraints
      - record only material current implementation evidence as observed and separate from target doctrine

  - id: document-unapproved-implementation-change
    prompt: An implementer added a persisted eligibility flag and changed retrieval behavior even though the confirmed PIP only required safe public output. Update the PIP to document what now exists.
    should_activate: true
    must:
      - preserve safe public output as the current target unless the product leader changes it
      - record the current implementation as an observed source-backed implementation observation
      - state whether the implementation aligns, deviates, or is unclear relative to confirmed intent
      - present any desired doctrine change as proposed or as an open conflict rather than confirmed
      - avoid redrawing canonical target diagrams to ratify the implementation

  - id: scoped-development-complexity
    prompt: Assess DCL for a PIP whose offline preparation may stop and be retried
      manually, whose publication boundary protects durable public state, and whose
      user-facing retrieval must serve a large, rapidly growing corpus. The current
      PIP and implementation differ.
    should_activate: true
    must:
      - derive separate scoped targets from current users, interactions, failure consequences, recovery expectations, risk, and credible load
      - avoid a package-wide level, average, inherited level, or feature checklist
      - use the optional dcl field on a coherently scoped YAML owner when one exists
      - show target, PIP-current, and implementation-current values with each implementable sequence
      - keep the target proposed until the product leader adopts it and keep both current values inferred
      - cite the implementation snapshot and explain differing known values in a gap note
      - preserve exact dangerous-edge protections regardless of a surrounding process's low DCL
      - treat a mismatch as a review signal rather than authority to add or delete machinery

  - id: negative-ordinary-coding
    prompt: Refactor this utility module without changing behavior.
    should_activate: false
