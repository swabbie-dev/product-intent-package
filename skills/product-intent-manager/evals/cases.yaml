cases:
  - id: proportional-greenfield
    prompt: Create a Product Intent Package for a small single-user application.
    should_activate: true
    must:
      - start with the three default format-7.0 files
      - put simple observable acceptance on capabilities in product.yaml
      - add a separate acceptance file or another optional artifact only when it answers a distinct question
      - omit package and item status, readiness, governance, signatures, confirmation metadata, implementation findings, and handoff records
      - record release, outcome, boundary, actors, capabilities, exclusions, measures, and optional default DCL
      - add concise current rationale to owning diagram files without product history
      - leave unspecified internal choices to engineering within current constraints

  - id: reconstruct-existing-product
    prompt: Reconstruct the current intent of this existing product from its screens,
      code, documents, and stakeholder decisions.
    should_activate: true
    must:
      - use separate working notes and an isolated PIP fork
      - treat sources as evidence rather than automatic target intent
      - keep observations, inferences, questions, and implementation differences outside the PIP
      - route material product choices through the product leader
      - express one coherent end state in the fork without status labels
      - leave the canonical PIP unchanged until the fork is adopted
      - preserve a legacy package format unless migration is explicitly requested

  - id: iterate-semantic-change
    prompt: Change subscriptions so users can pause and resume, then update the Product
      Intent Package.
    should_activate: true
    must:
      - identify the changed actor outcome and owning product fact
      - use an isolated PIP fork if the new end state still needs a product decision
      - update actual dependent artifacts, acceptance, and current rationale
      - keep only one coherent current end state in the canonical PIP
      - use Git for ordinary history rather than product-history bookkeeping
      - avoid changing unrelated artifacts

  - id: separate-diagram-responsibilities
    prompt: A user flow repeats membership checks, database reads, sorting, pagination,
      and failures from its sequence diagram. Simplify the diagrams without losing context.
    should_activate: true
    must:
      - keep actor actions, surfaces, visible outcomes, and recovery in the user flow
      - make surface boundaries clear enough to identify needed mockups and state variants
      - keep ordered runtime logic, input provenance, retries, and fallbacks in focused sequences
      - keep stable lifecycle states and process interaction in state machines
      - omit polling, heartbeats, lease renewal, retries, and other non-state-changing loops from state machines
      - keep entities and relationships in the data model or ERD
      - use stack context for physical participants, deployment, responsibilities, and owned state
      - preserve context with direct references instead of copied logic

  - id: product-significant-index-notation
    prompt: Review an ERD where a partial index gives the same column both [P1·1]
      and [P1·where], routine primary keys are labeled as unique indexes, and two
      physical queue indexes share [I1].
    should_activate: true
    must:
      - assign a separate base badge to each complete physical index
      - keep numeric suffixes for direct ordered keys
      - use expr for a separate indexed expression, inc for an included column, and where only for a predicate-only column
      - remove redundant same-index where badges from direct keys or expression sources
      - keep routine primary-key indexes out of the index compartment unless their physical behavior is independently product-significant
      - preserve the complete definition and product or process reason in the index compartment

  - id: pip-governed-implementation
    prompt: Implement the application described by this Product Intent Package.
    should_activate: true
    must:
      - record the task-start canonical PIP revision outside the PIP
      - prevent same-task tickets, code, tests, audits, and PIP edits from circularly creating product intent
      - inspect existing code and follow sequence reuse or modification anchors
      - follow exact linked mockups and compatible example code without silent redesign
      - pause before a new classification, population split, processing-boundary change, broad backfill, or product-policy predicate
      - keep implementation findings and alignment results outside the PIP
      - fix implementation toward current intent or create a PIP fork for a desired intent change

  - id: document-unapproved-implementation-change
    prompt: An implementer added a persisted eligibility flag and changed retrieval behavior even though the PIP only requires safe public output. Update the PIP to document what now exists.
    should_activate: true
    must:
      - refuse to rewrite canonical intent merely to match implementation
      - report the material implementation deviation in task or audit notes
      - preserve safe public output as canonical intent unless the product leader changes it
      - create an isolated coherent PIP fork only if the changed end state should be considered
      - avoid implementation observations, proposal statuses, or as-built diagrams in the canonical package

  - id: development-complexity-default-and-overrides
    prompt: Set DCL for a product whose ordinary paths are a small production product,
      whose offline preparation may be retried manually, and whose interactive
      retrieval serves a rapidly growing corpus.
    should_activate: true
    must:
      - derive one product-wide default from current users, interactions, failure consequences, recovery, risk, and credible load
      - add narrow overrides only for materially different scopes
      - avoid assigning DCL to every record, averaging levels, or raising the default to the highest exception
      - show default or override DCL above each implementable sequence
      - keep implementation DCL and target-versus-implementation comparisons outside the PIP
      - preserve dangerous-edge protections regardless of a low default or override
      - treat DCL as shorthand rather than a feature checklist or readiness gate

  - id: current-rationale-not-history
    prompt: Explain in the PIP why the current web, worker, and database architecture was chosen.
    should_activate: true
    must:
      - put each reason in the diagram file that owns the design choice
      - state all active causes, constraints, consequences, and material tradeoffs succinctly
      - avoid dates, former designs, superseded decisions, and chronological product history
      - use Git rather than a PIP decision log for ordinary history

  - id: negative-ordinary-coding
    prompt: Refactor this utility module without changing behavior.
    should_activate: false
